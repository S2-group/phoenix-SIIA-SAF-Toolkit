    <!-- EasyMDE Assets -->
    <link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css">
    <script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>
    <!-- End EasyMDE Assets -->

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        // --- Global state ---
        let isLoggedIn = true; // default allow editing
        let isEditMode = false;
        let currentLabelId = null; // Use database ID
        let displayedLabelId = null; // Track ID of content being viewed (might be original or copy)
        let rawMarkdownContent = ''; // Store fetched markdown
        let wikiEditorInstance = null; // To hold the EasyMDE instance

        // --- Auth Check ---
        async function checkAuthStatus() {
            try {
                const response = await fetch('api/auth/status', { credentials:'include' });
                const status = await response.json();
                isLoggedIn = status.loggedIn;
            } catch (error) {
                console.error('Error checking auth status:', error);
                // Assume logged in for local/testing purposes when auth endpoint missing
                isLoggedIn = true;
            }
            toggleEditControlsVisibility(); // Show/hide edit button based on login status
        }

        // --- Moved Function Definitions Outside DOMContentLoaded ---
        // Functie om unieke anchors toe te voegen aan alle headings
        function addAnchorsToHeadings() {
            const headings = document.querySelectorAll('#wiki-container h1, #wiki-container h2, #wiki-container h3, #wiki-container h4, #wiki-container h5, #wiki-container h6');
            headings.forEach(heading => {
                const text = heading.innerText;
                if (text) {
                    const anchor = text.toLowerCase().replace(/[^\w]+/g, '-');
                    heading.id = anchor;
                }
            });
        }

        // Functie om een TOC te genereren op basis van unieke IDs van headings
        function generateTOC() {
            const tocContainer = document.getElementById('toc-container');
            tocContainer.innerHTML = '<h2>Inhoudsopgave</h2><ul></ul>';
            
            const ul = tocContainer.querySelector('ul');
            const headings = document.querySelectorAll('#wiki-container h1, #wiki-container h2, #wiki-container h3, #wiki-container h4, #wiki-container h5, #wiki-container h6');
            
            headings.forEach(heading => {
                const text = heading.innerText;
                const id = heading.id;

                if (id && text) {
                    const li = document.createElement('li');
                    const link = document.createElement('a');
                    link.href = `#${id}`;
                    link.textContent = text;
                    link.textContent = `- ${text}`;
                    li.appendChild(link);
                    ul.appendChild(li);
                }
            });
        }

        // Render the current markdown into HTML and rebuild anchors / TOC
        function renderView() {
            const wikiContainer = document.getElementById('wiki-container');
            if (!wikiContainer) return;
            wikiContainer.innerHTML = marked.parse(rawMarkdownContent || '');
            addAnchorsToHeadings();
            generateTOC();
        }

        // Edit Mode Toggling
        function toggleEditMode() {
            if (!isLoggedIn) return; 
            if (!displayedLabelId && !isEditMode) { // Allow exiting edit mode even if ID failed, but not entering
                console.warn('Cannot enter edit mode, displayedLabelId is not set.');
                return; 
            }

            isEditMode = !isEditMode;
            const editButton = document.getElementById('edit-wiki-btn');
            const tocContainer = document.getElementById('toc-container');
            const viewContainer = document.getElementById('wiki-container');
            const editContainer = document.getElementById('wiki-edit-container');
            const saveButton = document.getElementById('save-wiki-btn');
            const editorTextarea = document.getElementById('wiki-editor');

            if (isEditMode) {
                // --- Enter Edit Mode ---
                editButton.textContent = 'View Content';
                tocContainer.style.display = 'none';
                viewContainer.style.display = 'none';
                
                // Initialize EasyMDE if it doesn't exist
                if (!wikiEditorInstance) {
                    console.log("[DEBUG] Initializing EasyMDE");
                    wikiEditorInstance = new EasyMDE({
                        element: editorTextarea,
                        spellChecker: false, // Disable spell checker if not needed
                        // status: false, // Hide status bar if desired
                        initialValue: rawMarkdownContent // Set initial content here
                    });
                } else {
                     // If instance exists, just update its value
                     wikiEditorInstance.value(rawMarkdownContent);
                }
                
                editContainer.style.display = 'block';
                saveButton.style.display = 'inline-block';
            } else {
                // --- Exit Edit Mode (back to View) ---
                editButton.textContent = 'Edit Content';
                editContainer.style.display = 'none';
                saveButton.style.display = 'none'; 
                tocContainer.style.display = 'block';
                viewContainer.style.display = 'block';
                // Optional: Destroy editor instance if needed, but hiding is often fine
                // if (wikiEditorInstance) {
                //    wikiEditorInstance.toTextArea();
                //    wikiEditorInstance = null;
                // }
            }
        }

        // Show/Hide Edit Controls based on login
        function toggleEditControlsVisibility() {
            const editButton = document.getElementById('edit-wiki-btn');
            if (editButton) {
                editButton.style.display = isLoggedIn ? 'inline-block' : 'none';
            }
            // Ensure edit container and save button are hidden initially or if logged out
            const editContainer = document.getElementById('wiki-edit-container');
            if (editContainer) {
                editContainer.style.display = 'none'; 
            }
             const saveButton = document.getElementById('save-wiki-btn');
             if (saveButton) {
                 saveButton.style.display = 'none'; // Initially hidden
            }
        }

        // Save Wiki Content (Connects to Backend)
        async function saveWikiContent() {
            if (!isEditMode || !displayedLabelId) return; 

            // Get content from EasyMDE instance
            const updatedMarkdown = wikiEditorInstance ? wikiEditorInstance.value() : ''; 
            
            console.log("--- Triggering SAVE ---");
            console.log("Label ID being saved:", displayedLabelId);

            try {
                const response = await fetch('api/wiki_save.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include', // Send session cookie
                    body: JSON.stringify({ 
                        labelId: displayedLabelId, 
                        markdownContent: updatedMarkdown 
                    })
                });

                if (!response.ok) {
                    // Try to get error message from backend response
                    let errorMsg = `Save failed with status: ${response.status}`;
                    try {
                        const errorData = await response.json();
                        errorMsg = errorData.error || errorMsg;
                    } catch (e) { /* Ignore if response is not JSON */ }
                    throw new Error(errorMsg);
                }

                const result = await response.json();
                if (result.success) {
                    console.log('Save successful!');
                    rawMarkdownContent = updatedMarkdown; // Update local content cache
                    alert('Wiki page saved successfully!');

                    // Handle if a new copy was created
                    if (result.newId) {
                        console.log(`Default label edit created new user copy with ID: ${result.newId}`);
                        displayedLabelId = result.newId; // Update the ID we are now viewing/editing
                        // Optionally update URL without reload:
                        // const newUrl = `${window.location.pathname}?id=${displayedLabelId}`;
                        // window.history.pushState({ path: newUrl }, '', newUrl);
                        // document.title = document.title + ' (Your Edit)'; // Indicate it's a copy
                    } else {
                         displayedLabelId = result.labelId; // Confirm the ID saved (useful if backend logic changes)
                    }
                    
                    // --- Re-render the view container with the new content ---
                    const htmlContent = marked.parse(rawMarkdownContent);
                    document.getElementById('wiki-container').innerHTML = htmlContent;
                    addAnchorsToHeadings(); // Re-apply anchors to new headings
                    generateTOC(); // Regenerate TOC based on new content
                    // --- End Re-render ---

                    toggleEditMode(); // Switch back to view mode AFTER re-rendering

                } else {
                    throw new Error('Save failed on the server.');
                }

            } catch (error) {
                console.error('Error saving wiki content:', error);
                alert(`Error saving wiki page: ${error.message}`);
            }
        }
        // --- End Moved Functions ---

        document.addEventListener('DOMContentLoaded', async function () {
            // This script is for the local wiki, so we can remove auth checks and simplify.
            console.log("Initializing local wiki page...");

            const params = new URLSearchParams(window.location.search);
            const pageId = params.get('id'); 
            const RADAR_DATA_KEY = 'MY_RADAR_LABELS_V1';

            if(!pageId){
               document.getElementById('wiki-container').innerHTML = '<div style="padding:2em;font-weight:bold;color:red;">Error: No page ID specified in the URL.</div>';
               return;
            }
            
            const storageKey = `WIKI_${pageId}`;
            const allLabels = JSON.parse(localStorage.getItem(RADAR_DATA_KEY) || '[]');
            const currentLabel = allLabels.find(label => String(label.id) === pageId);

            const userContent = localStorage.getItem(storageKey);
            if (userContent !== null) {
                rawMarkdownContent = userContent;
            } else if (currentLabel) {
                 rawMarkdownContent = `# ${currentLabel.label}\n\nThis is a new local wiki page. Click 'Bewerk pagina' to add your content.`;
            } else {
                rawMarkdownContent = `# Error\n\nCould not pre-fill content because label with ID "${pageId}" was not found.`;
            }

            const firstLine = rawMarkdownContent.split('\n')[0];
            const pageTitle = firstLine.startsWith('# ') ? firstLine.substring(2) : (currentLabel ? currentLabel.label : pageId);
            document.title = pageTitle;
            renderView();

            document.getElementById('back-to-radar-btn').onclick = () => { window.location.href = 'mijnradar.html'; };

            /* --- wire wiki edit buttons (new logic) --- */
            const editBtn = document.getElementById('edit-page-btn');
            const saveWikiBtn = document.getElementById('save-wiki-btn');
            const cancelWikiBtn = document.getElementById('cancel-wiki-btn');
            const editContainer = document.getElementById('wiki-edit-container');
            const viewContainer = document.getElementById('wiki-container');
            const wikiActions = document.getElementById('wiki-actions');

            const enterEditMode = () => {
                viewContainer.style.display = 'none';
                wikiActions.style.display = 'none'; // Hide the top bar with "Bewerk pagina"
                editContainer.style.display = 'block';
                
                if (!wikiEditorInstance) {
                    wikiEditorInstance = new EasyMDE({
                        element: document.getElementById('wiki-editor'),
                        initialValue: rawMarkdownContent,
                        spellChecker:false,
                        lineWrapping:true
                    });
                } else {
                    wikiEditorInstance.value(rawMarkdownContent);
                }
            };

            const exitEditMode = () => {
                editContainer.style.display = 'none';
                viewContainer.style.display = 'block';
                wikiActions.style.display = 'flex'; // Show the top bar again
                renderView(); // Re-render to show any saved changes
            };

            editBtn.onclick = enterEditMode;

            saveWikiBtn.onclick = () => {
                rawMarkdownContent = wikiEditorInstance.value();
                localStorage.setItem(storageKey, rawMarkdownContent);
                exitEditMode();
            };

            cancelWikiBtn.onclick = () => {
                // Don't save, just exit
                exitEditMode();
            };
        });
    </script>

t=\"130\" width=\"120\" y=\"2.842170943040401e-14\" as=\"geometry\"/><\/mxCell><mxCell id=\"4\" parent=\"2\" style=\"text;html=1;whiteSpace=wrap;strokeColor=none;fillColor=none;align=center;verticalAlign=middle;rounded=0;fontFamily=Architects Daughter;fontSource=https%3A%2F%2Ffonts.googleapis.com%2Fcss%3Ffamily%3DArchitects%2BDaughter;fontColor=#666666;\" value=\"&lt;font style=&quot;color: light-dark(rgb(8, 8, 8), rgb(18, 18, 18));&quot;&gt;STAKEHOLDER&lt;/font&gt;\" vertex=\"1\"><mxGeometry height=\"30\" width=\"100\" x=\"10\" as=\"geometry\"/><\/mxCell><\/root><\/mxGraphModel>","w":120,"h":130.00000000000003,"aspect":"fixed","title":"stakeholder-specific cluster"},{"xml":"<mxGraphModel><root><mxCell id=\"0\"/><mxCell id=\"1\" parent=\"0\"/><mxCell id=\"2\" parent=\"1\" style=\"html=1;points=[];perimeter=orthogonalPerimeter;fillColor=strokeColor;\" value=\"\" vertex=\"1\"><mxGeometry height=\"80\" width=\"5\" as=\"geometry\"/><\/mxCell><\/root><\/mxGraphModel>","w":5,"h":80,"aspect":"fixed","title":"tradeoff between 1:N concerns"}];
    const DRAWIO_CONFIG = {
        defaultLibraries: 'saf-decision-map;general',   // shown in the left panel on start
        libraries: [{
            title: { main: 'SAF Toolkit' },
            entries: [{
                id: 'saf-decision-map',
                title: { main: 'SAF Toolkit Library (Decision Map)' },
                desc: { main: 'Custom elements for the SAF Decision Map' },
                libs: [{ title: { main: 'SAF Toolkit Library (Decision Map)' }, data: SAF_LIBRARY }]
            }]
        }]
    };
    const DRAWIO_ORIGIN = 'https://embed.diagrams.net';
    const SAMPLE_XML =
        '<mxGraphModel><root><mxCell id="0"/><mxCell id="1" parent="0"/>' +
        '<mxCell id="2" value="Hello" style="rounded=1;whiteSpace=wrap;html=1;" vertex="1" parent="1"><mxGeometry x="40" y="40" width="120" height="60" as="geometry"/></mxCell>' +
        '<mxCell id="3" value="World" style="rounded=1;whiteSpace=wrap;html=1;" vertex="1" parent="1"><mxGeometry x="240" y="40" width="120" height="60" as="geometry"/></mxCell>' +
        '<mxCell id="4" style="edgeStyle=orthogonalEdgeStyle;endArrow=classic;html=1;" edge="1" parent="1" source="2" target="3"><mxGeometry relative="1" as="geometry"/></mxCell>' +
        '</root></mxGraphModel>';
    const SAMPLE_SVG =
        '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="140" viewBox="0 0 400 140" font-family="Helvetica,Arial,sans-serif" font-size="14">' +
        '<defs><marker id="dio-a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>' +
        '<rect x="40" y="40" width="120" height="60" rx="10" fill="#fff" stroke="#333"/><text x="100" y="75" text-anchor="middle">Hello</text>' +
        '<rect x="240" y="40" width="120" height="60" rx="10" fill="#fff" stroke="#333"/><text x="300" y="75" text-anchor="middle">World</text>' +
        '<line x1="160" y1="70" x2="238" y2="70" stroke="#333" marker-end="url(#dio-a)"/></svg>';

    const pageId = new URLSearchParams(window.location.search).get('id') || 'default';
    const key = suffix => 'DRAWIO_' + suffix + '_' + pageId;

    let frame = null, pendingXml = null, exitAfterExport = false;

    function renderPreview() {
        const box = document.getElementById('drawio-preview');
        const svg = localStorage.getItem(key('SVG'));   // data:image/svg+xml;base64,...
        if (svg) {
            box.innerHTML = '';
            const img = document.createElement('img');
            img.alt = 'draw.io diagram';
            img.src = svg;
            box.appendChild(img);
        } else {
            box.innerHTML = SAMPLE_SVG;   // placeholder until the first save
        }
    }

    function post(msg) {
        if (frame) frame.contentWindow.postMessage(JSON.stringify(msg), DRAWIO_ORIGIN);
    }

    function closeEditor() {
        window.removeEventListener('message', onMessage);
        const overlay = document.getElementById('drawio-overlay');
        overlay.style.display = 'none';
        overlay.innerHTML = '';
        frame = null; pendingXml = null; exitAfterExport = false;
    }

    function onMessage(evt) {
        if (!frame || evt.source !== frame.contentWindow || evt.origin !== DRAWIO_ORIGIN) return;
        if (typeof evt.data !== 'string' || !evt.data.length) return;
        let msg;
        try { msg = JSON.parse(evt.data); } catch (e) { return; }

        switch (msg.event) {
            case 'configure':   // editor waits for config before starting -> send the custom library
                post({ action: 'configure', config: DRAWIO_CONFIG });
                break;
            case 'init':    // editor ready -> send the diagram
                post({ action: 'load', autosave: 0, xml: localStorage.getItem(key('XML')) || SAMPLE_XML });
                break;
            case 'save':    // Save / Save & Exit -> request SVG with embedded XML
                pendingXml = msg.xml;
                exitAfterExport = !!msg.exit;
                post({ action: 'export', format: 'xmlsvg', xml: msg.xml, spinKey: 'saving' });
                break;
            case 'export':  // SVG received -> persist and refresh the preview
                localStorage.setItem(key('XML'), pendingXml || msg.xml || '');
                localStorage.setItem(key('SVG'), msg.data);
                renderPreview();
                if (exitAfterExport) closeEditor();
                else post({ action: 'status', message: 'Opgeslagen', modified: false });
                break;
            case 'exit':
                closeEditor();
                break;
        }
    }

    window.openDrawioEditor = function () {
        if (frame) return;
        frame = document.createElement('iframe');
        frame.src = DRAWIO_URL;
        const overlay = document.getElementById('drawio-overlay');
        overlay.appendChild(frame);
        overlay.style.display = 'block';
        window.addEventListener('message', onMessage);
    };

    window.resetDrawio = function () {
        if (!confirm('Diagram terugzetten naar het voorbeeld?')) return;
        localStorage.removeItem(key('XML'));
        localStorage.removeItem(key('SVG'));
        renderPreview();
    };

    document.addEventListener('DOMContentLoaded', renderPreview);
})();
</script>
